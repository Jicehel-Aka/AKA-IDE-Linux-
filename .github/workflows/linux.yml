name: Build and test Linux

on:
  push:
    branches:
      - main
      - avalonia

  pull_request:
    branches:
      - main
      - avalonia

jobs:
  linux:
    name: Ubuntu / .NET 10 / Avalonia
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Display environment
        run: |
          dotnet --info
          uname -a

      - name: Restore
        run: dotnet restore GamebuinoAKA.sln

      - name: Reject WPF dependencies in Core
        run: |
          if grep -R -n -E "System\.Windows|PresentationFramework|PresentationCore|WindowsBase" src/GamebuinoAKA.Core; then
            echo "ERREUR : dépendance WPF détectée dans GamebuinoAKA.Core."
            exit 1
          fi

      - name: Reject WPF dependencies in Core
        run: |
          if grep -R -n -E "System\.Windows|PresentationFramework|PresentationC>
            echo "ERREUR : dépendance WPF détectée dans GamebuinoAKA.Core."
            exit 1
          fi

      - name: Build
        run: dotnet build GamebuinoAKA.sln --configuration Release --no-restore

      - name: Run Core tests
        run: >
          dotnet test
          tests/GamebuinoAKA.Core.Tests/GamebuinoAKA.Core.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal

      - name: Publish Linux application
        run: >
          dotnet publish
          src/GamebuinoAKA.App/GamebuinoAKA.App.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamebuinoAKA-IDE-linux-x64
          path: artifacts/linux-x64/
          if-no-files-found: error
