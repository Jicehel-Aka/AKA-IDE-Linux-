name: Build and test Windows
on:
  push:
    branches:
      - main
      - avalonia
  pull_request:
    branches:
      - main
      - avalonia
jobs:
  windows:
    name: Windows / .NET 10 / Avalonia
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Display environment
        run: |
          dotnet --info
      - name: Restore
        run: dotnet restore GamebuinoAKA.sln
      - name: Build
        run: dotnet build GamebuinoAKA.sln --configuration Release --no-restore
      - name: Run Core tests
        run: >
          dotnet test
          tests/GamebuinoAKA.Core.Tests/GamebuinoAKA.Core.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
      - name: Publish Windows application
        run: >
          dotnet publish
          src/GamebuinoAKA.App/GamebuinoAKA.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/win-x64
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamebuinoAKA-IDE-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
